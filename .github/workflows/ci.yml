name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Provenance.slnx
      - run: dotnet build Provenance.slnx --no-restore --configuration Release
      - run: dotnet test Provenance.slnx --no-build --configuration Release
      - run: dotnet run --project samples/IssueTriage --no-build --configuration Release
